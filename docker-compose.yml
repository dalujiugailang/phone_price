services:
  app:
    build:
      context: .
    container_name: gtm-price-monitor-app
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      PORT: 8787
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_AGENTS_DISABLE_TRACING: ${OPENAI_AGENTS_DISABLE_TRACING:-1}
      DAILY_PRICE_LOOKUP_URL: ${DAILY_PRICE_LOOKUP_URL:-http://host.docker.internal:8765/api/lookup}
      DAILY_PRICE_TOKEN_PATH: /app/data/api_token.txt
      PRICE_MONITOR_DATA_DIR: /app/data
      PRICE_MONITOR_WORKBOOK_PATH: /app/data/新机售价监控.xlsx
      PRICE_MONITOR_DRAFT_DB_PATH: /app/data/raw-editor-draft.sqlite
      PRICE_COLLECTION_SCHEDULE_ENABLED: ${PRICE_COLLECTION_SCHEDULE_ENABLED:-true}
      MAISHOU_INVITE_CODE: ${MAISHOU_INVITE_CODE:-}
      MAISHOU_OPENID: ${MAISHOU_OPENID:-}
      MAISHOU_HEADERS_JSON: ${MAISHOU_HEADERS_JSON:-}
      MARKET_TREND_WORKBOOK_PATH: /app/data/市场总量份额趋势.xlsx
      MARKET_TREND_DRAFT_DB_PATH: /app/data/market-trend.sqlite
      GTM_WAREHOUSE_PATH: /app/data/warehouse/gtm_warehouse.duckdb
      WAREHOUSE_REFRESH_ENABLED: ${WAREHOUSE_REFRESH_ENABLED:-true}
      WAREHOUSE_REFRESH_INTERVAL_MINUTES: ${WAREHOUSE_REFRESH_INTERVAL_MINUTES:-15}
      DAILY_PRICE_DUCKDB_PATH: ${DAILY_PRICE_DUCKDB_PATH:-/app/daily-price/daily_price.duckdb}
      WAREHOUSE_PRICE_YEAR: ${WAREHOUSE_PRICE_YEAR:-2026}
      WAREHOUSE_NEW_BATCH_START_DATE: ${WAREHOUSE_NEW_BATCH_START_DATE:-2026-05-26}
      WEIBO_SOURCE_UID: ${WEIBO_SOURCE_UID:-7928198622}
      WEIBO_LOOKBACK_DAYS: ${WEIBO_LOOKBACK_DAYS:-21}
      WEEKLY_SALES_AUTOMATION_TOKEN: ${WEEKLY_SALES_AUTOMATION_TOKEN:-}
      WEEKLY_SALES_WORKER_TOKEN: ${WEEKLY_SALES_WORKER_TOKEN:-}
      WEEKLY_SALES_SCHEDULE_ENABLED: ${WEEKLY_SALES_SCHEDULE_ENABLED:-true}
      WEEKLY_SALES_SCHEDULE_TIMEZONE: ${WEEKLY_SALES_SCHEDULE_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
      - ${DAILY_PRICE_DATA_DIR:-/www/wwwroot/daily-price/data}:/app/daily-price:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - personal_ai_gateway
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mcp:
    build:
      context: .
    container_name: gtm-price-monitor-mcp
    restart: unless-stopped
    command: npm run mcp
    environment:
      NODE_ENV: production
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8790
      MCP_API_TOKENS: ${MCP_API_TOKENS}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-https://mcp.gtmdudu.xyz}
      PRICE_MONITOR_DATA_DIR: /app/data
      PRICE_MONITOR_WORKBOOK_PATH: /app/data/新机售价监控.xlsx
    volumes:
      - ./data:/app/data:ro
    expose:
      - "8790"

  caddy:
    image: caddy:2-alpine
    container_name: gtm-price-monitor-caddy
    restart: unless-stopped
    depends_on:
      - app
      - mcp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - personal_ai_gateway

volumes:
  caddy_data:
  caddy_config:

networks:
  personal_ai_gateway:
    external: true
    name: personal-ai-gateway
